<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A simple personal homepage.">
    <title>My Homepage</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1e293b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(680px, calc(100% - 2rem));
        padding: 3rem;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(15 23 42 / 12%);
      }
      h1 { margin: 0 0 .5rem; color: #1d4ed8; }
      p { line-height: 1.7; }
      .note { color: #64748b; font-size: .95rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, I’m [Your Name]</h1>
      <p>I am a student learning web development. This is my personal homepage.</p>
      <p>I enjoy learning new things and building simple projects.</p>
      <p class="note">Edit this page in <code>index.html</code> to add your own name, interests, and links.</p>
    </main>
  </body>
</html>
